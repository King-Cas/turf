<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turf – find people to play sport with</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#000;--ink:#f5f5f5;--mute:#9a9a9a;--line:#3a3a3a;--acc:#d6f24a;--accink:#000;--hi:#d6f24a;--hiink:#000;--bad:#ff8a80;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 "Archivo",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--line);z-index:9}
.bar{max-width:960px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:900;font-stretch:75%;font-size:22px;letter-spacing:-.5px;color:var(--ink);text-decoration:none;margin-right:auto}
.logo i{font-style:normal;background:var(--hi);color:var(--hiink);padding:0 6px;border-radius:4px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:var(--ink);text-decoration:none;padding:6px 12px;border-radius:99px;font-weight:600;font-size:15px}
nav a.on{background:var(--ink);color:var(--bg)}
nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
main{max-width:960px;margin:auto;padding:24px 16px 64px}
h1{font-size:clamp(34px,7vw,60px);line-height:1;font-weight:900;font-stretch:75%;letter-spacing:-1.5px;margin:8px 0 14px}
h2{font-size:24px;font-weight:800;margin:0 0 12px}
p.lead{font-size:18px;color:var(--mute);max-width:52ch;margin:0 0 20px}
.btn{background:var(--acc);color:var(--accink);border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.sm{padding:6px 12px;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;font:inherit;font-weight:600;cursor:pointer}
.chip.on{background:var(--hi);color:var(--hiink);border-color:var(--hi)}
.list{display:grid;gap:12px}
.game{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:8px;padding:14px 16px;display:grid;gap:4px}
.game .top{display:flex;justify-content:space-between;gap:10px;align-items:start;flex-wrap:wrap}
.game b{font-size:18px}
.meta{color:var(--mute);font-size:14px}
.tag{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 8px;font-size:13px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px;max-width:440px}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:14px}
input,select{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.err{color:var(--bad);font-weight:600;margin:10px 0 0;min-height:1.4em}
.note{background:var(--hi);color:var(--hiink);border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:16px}
.empty{border:1.5px dashed var(--line);border-radius:8px;padding:24px;color:var(--mute)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.row{grid-template-columns:1fr}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.show{opacity:1}
</style>
</head>
<body>
<header><div class="bar">
<a class="logo" href="#/"><i>Turf</i></a>
<nav id="nav" aria-label="Main"></nav>
</div></header>
<main id="app"></main>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ============ Data layer: Supabase (live database and sign-in) ============ */
var SPORTS=[["Football","⚽"],["Basketball","🏀"],["Tennis","🎾"],["Running","🏃"],["Padel","🏸"],["Cycling","🚴"],["Volleyball","🏐"],["Cricket","🏏"]];
var SUPABASE_URL="https://sgfqakctuiejsoffjxnf.supabase.co";
var SUPABASE_KEY="sb_publishable_V62fhBHfqvJjCHE2ZuPdAA_3KsTINku";
var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
var cache={user:null,games:[]};
function mapGame(g){return {id:g.id,sport:g.sport,title:g.title,place:g.place,when:g.starts_at,spots:g.spots,level:g.level,host:g.host_id,hostName:(g.profiles&&g.profiles.name)||"Player",players:(g.game_players||[]).map(function(p){return p.user_id})}}
function fail(r){if(r.error)throw r.error;return r}
function refresh(){
  return sb.auth.getSession().then(function(r){
    var s=r.data.session;
    var pu=s?sb.from("profiles").select("*").eq("id",s.user.id).maybeSingle().then(function(x){var p=x.data||{};return {id:s.user.id,email:s.user.email,name:p.name||"Player",city:p.city||"",sports:p.sports||[]}}):Promise.resolve(null);
    var since=new Date(Date.now()-36e5).toISOString();
    var pg=sb.from("games").select("*,profiles!games_host_id_fkey(name),game_players(user_id)").gte("starts_at",since).order("starts_at").then(function(x){return fail(x).data.map(mapGame)});
    return Promise.all([pu,pg]).then(function(v){cache.user=v[0];cache.games=v[1]});
  });
}
var API={
  init:function(){return refresh().catch(function(e){toast("Could not load data: "+e.message)})},
  user:function(){return cache.user},
  games:function(){return cache.games},
  signUp:function(n,e,p){return sb.auth.signUp({email:e.trim(),password:p,options:{data:{name:n.trim()}}}).then(function(r){fail(r);if(!r.data.session)throw new Error("Check your email to confirm your account, then sign in.");return refresh()})},
  signIn:function(e,p){return sb.auth.signInWithPassword({email:e.trim(),password:p}).then(function(r){fail(r);return refresh()})},
  signOut:function(){return sb.auth.signOut().then(refresh)},
  saveProfile:function(f){return sb.from("profiles").update(f).eq("id",cache.user.id).then(function(r){fail(r);return refresh()})},
  create:function(g){return sb.from("games").insert({host_id:cache.user.id,sport:g.sport,title:g.title,place:g.place,starts_at:g.when,spots:g.spots,level:g.level}).then(function(r){fail(r);return refresh()})},
  join:function(id,on){var q=on?sb.from("game_players").insert({game_id:id,user_id:cache.user.id}):sb.from("game_players").delete().eq("game_id",id).eq("user_id",cache.user.id);return q.then(function(r){fail(r);return refresh()})}
};
/* ============ UI ============ */
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function emoji(s){var m=SPORTS.find(function(x){return x[0]===s});return m?m[1]:"🏅"}
function toast(t){var el=$("#toast");el.textContent=t;el.classList.add("show");setTimeout(function(){el.classList.remove("show")},2200)}
var filter="All";
function fmt(iso){return new Date(iso).toLocaleString(undefined,{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
function nav(route){
  var me=API.user();
  var links=[["#/","Home"],["#/games","Find games"],["#/create","Host a game"]];
  links.push(me?["#/profile","Profile"]:["#/auth","Sign in"]);
  $("#nav").innerHTML=links.map(function(l){return '<a href="'+l[0]+'"'+(route===l[0]?' class="on" aria-current="page"':"")+">"+l[1]+"</a>"}).join("");
}
function chips(sel,onclick,list){return '<div class="chips">'+list.map(function(s){return '<button class="chip'+(sel===s[0]?" on":"")+'" data-v="'+esc(s[0])+'">'+s[1]+" "+esc(s[0])+"</button>"}).join("")+"</div>"}
function gameCard(g){
  var me=API.user(),mine=me&&g.players.indexOf(me.id)>-1,full=g.players.length>=g.spots,left=g.spots-g.players.length;
  var btn=mine?'<button class="btn alt sm" data-leave="'+g.id+'">Leave</button>':full?'<span class="tag">Full</span>':'<button class="btn sm" data-join="'+g.id+'">Join game</button>';
  return '<article class="game"><div class="top"><b>'+emoji(g.sport)+" "+esc(g.title)+"</b>"+btn+'</div><div class="meta">'+esc(fmt(g.when))+" at "+esc(g.place)+'</div><div class="meta"><span class="tag">'+esc(g.sport)+'</span> <span class="tag">'+esc(g.level)+"</span> "+(left>0?left+" of "+g.spots+" spots left":"No spots left")+" · hosted by "+esc(g.hostName)+"</div></article>";
}
function bindJoin(){
  document.querySelectorAll("[data-join],[data-leave]").forEach(function(b){b.onclick=function(){
    if(!API.user()){location.hash="#/auth";toast("Sign in to join a game");return}
    var id=b.dataset.join||b.dataset.leave,j=!!b.dataset.join;API.join(id,j).then(function(){toast(j?"You’re in!":"You left the game");render()},function(e){toast(e.message)})}});
}
var views={
  "#/":function(){
    var gs=API.games().slice(0,3);
    return '<h1>Find people to play with.</h1><p class="lead">Pick your sport, see who’s playing nearby, and join a game in two taps. Or host your own and let others come to you.</p>'+
    '<a class="btn" href="#/games">Browse games</a> <a class="btn alt" href="#/create">Host a game</a>'+
    '<h2 style="margin-top:36px">Pick a sport</h2>'+chips("",null,SPORTS)+'<h2 style="margin-top:28px">Starting soon</h2><div class="list">'+gs.map(gameCard).join("")+"</div>";
  },
  "#/games":function(){
    var all=API.games().filter(function(g){return filter==="All"||g.sport===filter});
    return '<h1 style="font-size:40px">Find games</h1>'+chips(filter,null,[["All","🌍"]].concat(SPORTS))+
    '<div class="list">'+(all.length?all.map(gameCard).join(""):'<div class="empty">No '+esc(filter)+' games yet. <a href="#/create">Host the first one.</a></div>')+"</div>";
  },
  "#/create":function(){
    if(!API.user())return authView("Sign in to host a game.");
    var opts=SPORTS.map(function(s){return "<option>"+s[0]+"</option>"}).join("");
    return '<h1 style="font-size:40px">Host a game</h1><div class="card"><div id="f"><label for="t">Title</label><input id="t" placeholder="e.g. Friendly 5-a-side"><label for="s">Sport</label><select id="s">'+opts+'</select>'+
    '<label for="p">Place</label><input id="p" placeholder="Where are you playing?"><div class="row"><div><label for="w">Date and time</label><input id="w" type="datetime-local"></div><div><label for="n">Players needed</label><input id="n" type="number" min="2" max="40" value="6"></div></div>'+
    '<label for="l">Level</label><select id="l"><option>Beginner</option><option>Casual</option><option>Intermediate</option><option>Competitive</option></select><div class="err" id="e"></div><button class="btn" id="go">Publish game</button></div></div>';
  },
  "#/profile":function(){
    var me=API.user();if(!me)return authView("Sign in to see your profile.");
    var mine=API.games().filter(function(g){return g.players.indexOf(me.id)>-1});
    return '<h1 style="font-size:40px">Hi, '+esc(me.name)+'</h1><div class="card"><label for="pn">Name</label><input id="pn" value="'+esc(me.name)+'"><label for="pc">City</label><input id="pc" value="'+esc(me.city)+'" placeholder="Where do you play?">'+
    '<label>Your sports</label><div class="chips" id="ps">'+SPORTS.map(function(s){return '<button class="chip'+(me.sports.indexOf(s[0])>-1?" on":"")+'" data-v="'+s[0]+'">'+s[1]+" "+s[0]+"</button>"}).join("")+'</div>'+
    '<button class="btn" id="save">Save profile</button> <button class="btn alt" id="out">Sign out</button></div><h2 style="margin-top:32px">Your games</h2><div class="list">'+(mine.length?mine.map(gameCard).join(""):'<div class="empty">You haven’t joined any games yet. <a href="#/games">Find one.</a></div>')+"</div>";
  },
  "#/auth":function(){return authView("")}
};
var mode="in";
function authView(msg){
  var up=mode==="up";
  return '<div class="card"><h2>'+(up?"Create your account":"Welcome back")+"</h2>"+(msg?'<p class="meta">'+esc(msg)+"</p>":"")+
  '<div id="a">'+(up?'<label for="an">Name</label><input id="an" autocomplete="name">':"")+'<label for="ae">Email</label><input id="ae" type="email" autocomplete="email"><label for="ap">Password</label><input id="ap" type="password" autocomplete="'+(up?"new":"current")+'-password">'+
  '<div class="err" id="e"></div><button class="btn" id="ago">'+(up?"Sign up":"Sign in")+'</button> <button class="btn alt" id="sw">'+(up?"I have an account":"Create an account")+"</button></div></div>";
}
function wire(route){
  var app=$("#app");
  app.querySelectorAll(".chips .chip").forEach(function(c){c.onclick=function(){
    if(route==="#/games"){filter=c.dataset.v;render()}
    else if(route==="#/"){filter=c.dataset.v;location.hash="#/games"}
    else if(route==="#/profile"){c.classList.toggle("on")}}});
  bindJoin();
  var g=function(id){var el=$(id);return el?el.value:""};
  if($("#sw"))$("#sw").onclick=function(){mode=mode==="up"?"in":"up";render()};
  if($("#ago"))$("#ago").onclick=function(){
    
    if(!g("#ae")||!g("#ap")||(mode==="up"&&!g("#an").trim()))return $("#e").textContent="Fill in every field.";
    if(mode==="up"&&g("#ap").length<6)return $("#e").textContent="Use a password of at least 6 characters.";
    (mode==="up"?API.signUp(g("#an"),g("#ae"),g("#ap")):API.signIn(g("#ae"),g("#ap"))).then(function(){toast(mode==="up"?"Account created":"Signed in");location.hash=route==="#/auth"?"#/games":route;render()},function(e){$("#e").textContent=e.message})};
  if($("#go"))$("#go").onclick=function(){
    if(!g("#t").trim()||!g("#p").trim()||!g("#w"))return $("#e").textContent="Add a title, place and time.";
    API.create({title:g("#t").trim(),sport:g("#s"),place:g("#p").trim(),when:new Date(g("#w")).toISOString(),spots:Math.max(2,+g("#n")||2),level:g("#l")}).then(function(){toast("Game published");filter="All";location.hash="#/games"},function(e){$("#e").textContent=e.message})};
  if($("#save"))$("#save").onclick=function(){
    var sp=[].map.call(document.querySelectorAll("#ps .chip.on"),function(c){return c.dataset.v});
    API.saveProfile({name:g("#pn").trim()||API.user().name,city:g("#pc").trim(),sports:sp}).then(function(){toast("Profile saved");render()},function(e){toast(e.message)})};
  if($("#out"))$("#out").onclick=function(){API.signOut().then(function(){toast("Signed out");location.hash="#/";render()})};
}
function render(){
  var route=location.hash||"#/";if(!views[route])route="#/";
  nav(route);
  var banner="";
  $("#app").innerHTML=banner+views[route]();wire(route);window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);
API.init().then(render);
</script>
</body>
</html>
